server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded avatars, up to a few MB.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $http_host;
    }

    # SQLAdmin panel, reachable on the same public origin as the app. Note:
    # this is /sqladmin, not /admin -- the frontend's own React routes
    # already own /admin/* (dashboard, operators, permission-requests,
    # claim-requests), so SQLAdmin's default mount point was renamed
    # (backend/app/admin/setup.py) to avoid the two colliding here.
    location /sqladmin {
        proxy_pass http://backend:8000/sqladmin;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
