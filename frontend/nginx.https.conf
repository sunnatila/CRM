
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Uploaded avatars, up to a few MB.
    client_max_body_size 10m;

    # Docker re-assigns container IPs on every recreate, and nginx resolves an
    # upstream hostname exactly once at startup -- so a `docker compose up
    # --build` that recreates the backend leaves this container proxying to a
    # dead IP until it is itself restarted (502 "Host is unreachable").
    # Resolving through Docker's embedded DNS on a timer fixes that class of
    # failure permanently. proxy_pass must carry a variable for the resolver to
    # be consulted per-request, and $request_uri preserves the path + query
    # string that a literal-URI proxy_pass would otherwise rewrite.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;


    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
    }

    # SQLAdmin panel, reachable on the same public origin as the app. Note:
    # this is /sqladmin, not /admin -- the frontend's own React routes
    # already own /admin/* (dashboard, operators, permission-requests,
    # claim-requests), so SQLAdmin's default mount point was renamed
    # (backend/app/admin/setup.py) to avoid the two colliding here.
    location /sqladmin {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
