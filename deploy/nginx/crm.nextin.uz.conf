
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- HTTP :80
server {
    listen 80;
    listen [::]:80;
    server_name crm.nextin.uz;

    # Must stay reachable over plain HTTP for renewals, so it sits above the
    # redirect rather than below it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.nextin.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.nextin.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.nextin.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;  
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain
               text/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/crm.nextin.uz.access.log;
    error_log  /var/log/nginx/crm.nextin.uz.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # $host, not $server_name: the backend builds absolute redirects (e.g.
        # SQLAdmin's trailing-slash redirect) from what it is told here.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }
}
