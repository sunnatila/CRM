# crm.nextin.uz — host nginx (production)
#
# Goes in /etc/nginx/sites-available/crm.nextin.uz.conf on the server, symlinked
# into sites-enabled. This is the HOST nginx, in front of Docker.
#
# WHY IT IS A SINGLE PASSTHROUGH
# The frontend container runs its own nginx that already serves the SPA and
# routes /api, /static and /sqladmin to the backend over the compose network.
# Re-declaring those routes here would mean maintaining the same map twice and
# pointing at `backend:8000`, a compose service name that does not resolve on
# the host at all — an earlier attempt at exactly that is why WebSocket upgrades
# were 404ing. So the host terminates TLS and forwards everything, unchanged, to
# the container; the container decides what is API and what is app.
#
# PREREQUISITE — publish the app on loopback only, so the internet reaches it
# through this file and nothing else. In docker-compose.yml:
#     frontend:
#       ports:
#         - "127.0.0.1:3000:80"     # not "3000:80"
#
# FIRST RUN (no certificate yet): nginx will not start while ssl_certificate
# points at a file that does not exist. Comment out the whole `server` block for
# 443, reload, then:
#     sudo certbot certonly --webroot -w /var/www/certbot -d crm.nextin.uz
#     sudo mkdir -p /var/www/certbot
# then uncomment it and `sudo systemctl reload nginx`. Renewal is automatic
# (certbot installs a timer); the ACME location below keeps it working.

# Upgrade is a hop-by-hop header, so it must be forwarded explicitly -- and
# `Connection` has to be "upgrade" ONLY for requests that are actually
# upgrading. Hardcoding it breaks keepalive for every ordinary request, which is
# why this map exists rather than a literal value.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- HTTP :80
server {
    listen 80;
    listen [::]:80;
    server_name crm.nextin.uz;

    # Must stay reachable over plain HTTP for renewals, so it sits above the
    # redirect rather than below it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------- HTTPS :443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.nextin.uz;

    ssl_certificate     /etc/letsencrypt/live/crm.nextin.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.nextin.uz/privkey.pem;

    # Modern + intermediate: TLS 1.2 is kept because dropping it locks out older
    # Android handsets, which operators plausibly use.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # let the client pick; it knows its hardware
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS: only meaningful once HTTPS is known good. Leave commented until the
    # certificate is confirmed working -- it is hard to walk back, since browsers
    # remember it for max-age even if the site later has to serve plain HTTP.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Avatar uploads. The container's nginx allows the same; the smaller of the
    # two wins, so they must not drift apart.
    client_max_body_size 10m;

    # The API ships JSON uncompressed today. These are the types that actually
    # travel here; images and the already-compressed woff2 fonts are excluded
    # deliberately -- re-compressing them costs CPU and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain
               text/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/crm.nextin.uz.access.log;
    error_log  /var/log/nginx/crm.nextin.uz.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (/api/ws/notifications) -- the live queue and the bell both
        # depend on this surviving the hop.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # $host, not $server_name: the backend builds absolute redirects (e.g.
        # SQLAdmin's trailing-slash redirect) from what it is told here.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A WebSocket is idle between events by definition. The 60s default would
        # cut the notification socket roughly once a minute and leave the client
        # reconnecting forever; 7d is longer than any session.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_connect_timeout 10s;

        # Streaming rather than buffering: nothing here is large enough to
        # benefit, and buffering delays server-pushed frames.
        proxy_buffering off;
    }
}
